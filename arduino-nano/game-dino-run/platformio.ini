[platformio]
default_envs = arduino-nano          ; `pio run` / VSCode Build target only the firmware; native is test-only (pio test -e native)

[env:arduino-nano]
platform = atmelavr
board = nanoatmega328
board_upload.speed = 115200  ; NEW bootloader (confirmed by flash). Auto-reset is flaky on this CH340 board — tap RESET as the upload starts
framework = arduino
monitor_speed = 115200
build_flags = -I include     ; put the peripheral headers on the include path
lib_deps =
    ; TM1637 4-digit display driver (CLK/DIO bit-banged protocol). Pulled directly from GitHub —
    ; the PlatformIO registry re-registration has an unversioned alpha release, but its repository
    ; field points here, so this is the same source. Same choice as arduino-nano/toy-microwave.
    https://github.com/avishorp/TM1637.git
    olikraus/U8glib                  ; OLED gameplay panel (U8GLIB_SH1106_128X64)

; Off-device unit tests for the pure logic in each header: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++14 -I include
build_src_filter = -<*>      ; test-only env: never compile the Arduino firmware (src/) on the host
