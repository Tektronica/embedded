; App only: the pot and duty logic are tested in lib/PotInput and lib/PwmDuty (pio test -d <lib>)
[env:arduino-nano]
platform = atmelavr
board = nanoatmega328
board_upload.speed = 115200  ; NEW bootloader (confirmed by flash). Auto-reset is flaky on this CH340 board — tap RESET as the upload starts
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../../lib/PotInput
    symlink://../../lib/PwmDuty
