[platformio]
default_envs = arduino-nano          ; `pio run` / VSCode Build target only the firmware; native is test-only (pio test -e native)

[env:arduino-nano]
platform = atmelavr
board = nanoatmega328
board_upload.speed = 115200  ; NEW bootloader (confirmed by flash). Auto-reset is flaky on this CH340 board — tap RESET as the upload starts
framework = arduino
monitor_speed = 115200
build_flags = -I include     ; put the peripheral headers on the include path
lib_deps =
    waspinator/AccelStepper

; Off-device unit tests for the pure logic in Stepper.h: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++14 -I include
build_src_filter = -<*>      ; test-only env: never compile the Arduino firmware (src/) on the host
