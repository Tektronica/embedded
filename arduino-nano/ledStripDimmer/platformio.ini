[platformio]
default_envs = arduino-nano          ; `pio run` / VSCode Build target only the firmware; native is test-only (pio test -e native)

[env:arduino-nano]
platform = atmelavr
board = nanoatmega328
board_upload.speed = 115200  ; NEW bootloader (confirmed by flash). Auto-reset is flaky on this CH340 board — tap RESET as the upload starts
framework = arduino
monitor_speed = 115200
build_flags = -I include     ; put LEDStripDimmer.h on the include path
lib_deps =
    ; GitHub source (registry CDN *.contabostorage.com is blocked by Zscaler here — see docs/troubleshooting)
    https://github.com/FastLED/FastLED/archive/refs/tags/3.7.0.tar.gz

; Off-device unit tests for the pure logic (model + helpers): pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++14 -I include
build_src_filter = -<*>      ; test-only env: never compile the Arduino firmware (src/) on the host
