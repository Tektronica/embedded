; App only: scanning and debouncing are tested in lib/KeyMatrix and lib/Debounce (pio test -d <lib>)
[env:arduino-nano]
platform = atmelavr
board = nanoatmega328
board_upload.speed = 115200  ; NEW bootloader (confirmed by flash). Auto-reset is flaky on this CH340 board — tap RESET as the upload starts
framework = arduino
monitor_speed = 9600         ; matches Serial.begin(9600) in main.cpp
lib_deps =
    symlink://../../lib/Debounce
    symlink://../../lib/KeyMatrix
