[platformio]
default_envs = arduino-nano

[env:arduino-nano]
platform = atmelavr
board = nanoatmega328
board_upload.speed = 115200  ; NEW bootloader (confirmed by flash). Auto-reset is flaky on this CH340 board — tap RESET as the upload starts
framework = arduino
monitor_speed = 115200

; No native/test env and no include/ split -- everything here is hardware glue in main.cpp, on
; purpose (see main.cpp's comment). Nothing here is hardware-free logic worth unit-testing; that
; contrast is itself the point of this project existing alongside buzzer-song.
