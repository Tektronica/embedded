[env:nano]
platform = atmelavr
board = nanoatmega328        ; use nanoatmega328old if uploads time out (old bootloader)
framework = arduino
monitor_speed = 115200
build_flags = -I include     ; put shared headers (Config.h, Pins.h, HeatRamp.h, InputMap.h) on the lib path
lib_ldf_mode = deep+         ; resolve cross-library includes between lib/model|view|controller|appliance
lib_deps =
    ; GitHub source (registry CDN *.contabostorage.com is blocked by Zscaler here — see docs/troubleshooting)
    https://github.com/FastLED/FastLED/archive/refs/tags/3.7.0.tar.gz

; Off-device unit tests for the pure logic (model + helpers): pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++14 -I include
