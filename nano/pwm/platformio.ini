[platformio]
default_envs = nano          ; `pio run` / VSCode Build target only the firmware; native is test-only (pio test -e native)

[env:nano]
platform = atmelavr
board = nanoatmega328
board_upload.speed = 115200  ; NEW bootloader (confirmed by flash). Auto-reset is flaky on this CH340 board — tap RESET as the upload starts
framework = arduino
monitor_speed = 115200
build_flags = -I include     ; put Pwm.h on the include path

; Off-device unit tests for the pure logic (duty/frequency math): pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++14 -I include
build_src_filter = -<*>      ; test-only env: never compile the Arduino firmware (src/) on the host
