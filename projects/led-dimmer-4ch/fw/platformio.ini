; App only: the pot and duty logic are tested in lib/arduino/PotInput and lib/arduino/PwmDuty (pio test -d <lib>)
[env:arduino-nano]
platform = atmelavr
board = nanoatmega328
board_upload.speed = 115200  ; NEW bootloader — adjust if this board's Nano module uses the old one
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../../../lib/arduino/PotInput
    symlink://../../../lib/arduino/PwmDuty
