{% macro trend_chart(chart) %}
<div class="grid grid-cols-[3rem_1fr] gap-x-2">
  <div class="relative text-xs text-muted-foreground tabular-nums" aria-hidden="true">
    <span class="absolute left-0 top-0">{{ chart.unit }}</span>
    {% for tick in chart.y_ticks %}
      <span class="absolute right-0 -translate-y-1/2" style="top: {{ tick.percent }}%">{{ tick.label }}</span>
    {% endfor %}
  </div>
  <svg class="h-56 w-full" viewBox="0 0 {{ chart.width }} {{ chart.height }}" preserveAspectRatio="none" role="img"
       aria-label="{{ chart.description }}">
    {% for tick in chart.y_ticks %}
      <line x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}" y1="{{ tick.coordinate }}" y2="{{ tick.coordinate }}" class="stroke-border" vector-effect="non-scaling-stroke" />
    {% endfor %}
    {% for tick in chart.x_ticks %}
      <line x1="{{ tick.coordinate }}" x2="{{ tick.coordinate }}" y1="{{ chart.plot_top }}" y2="{{ chart.plot_bottom }}" class="stroke-border" vector-effect="non-scaling-stroke" />
    {% endfor %}
    {% for segment in chart.segments %}
      {% if segment.is_single_point %}
        <line x1="{{ segment.x }}" x2="{{ segment.x }}" y1="{{ segment.y }}" y2="{{ segment.y }}" class="stroke-primary" stroke-width="6" stroke-linecap="round" vector-effect="non-scaling-stroke" />
      {% else %}
        <polygon points="{{ segment.area }}" class="fill-muted" />
        <polyline points="{{ segment.line }}" fill="none" class="stroke-primary" stroke-width="2" vector-effect="non-scaling-stroke" />
      {% endif %}
    {% endfor %}
  </svg>
  <div></div>
  <div class="relative mt-1 h-9 text-xs text-muted-foreground" aria-hidden="true">
    {% for tick in chart.x_ticks %}
      <span class="absolute -translate-x-1/2 whitespace-pre-line text-center {{ 'hidden sm:block' if tick.hidden_on_narrow }}" style="left: {{ tick.percent }}%">{{ tick.label }}</span>
    {% endfor %}
  </div>
</div>
{% endmacro %}
