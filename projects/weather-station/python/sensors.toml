# Sensors attached to this Pi. One [[sensor]] block each. At startup the sensors service builds
# every block and keeps only the sensors that answer a first read, so an unplugged sensor is left
# out. Restart the service after plugging one in. Models and options are listed in the README.

[[sensor]]
id = "room-am2302"
model = "am2302"
gpio = 4

